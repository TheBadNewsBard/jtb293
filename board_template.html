<style>

  --fg: #1c1a16; --fg-2: #56534b; --fg-3: #8a867c;
  --accent: #a8731a; --accent-ink: #fff;
  --s1: #b8791a; --s2: #2f7fb0; --s3: #4f8f2f;
  --good: #3e8a2a; --warn: #a8731a; --bad: #c2412f; --info: #2f7fb0;
  --r5: #a8731a; --r4: #3f6f95; --r3: #8a867c; --t1: #b8791a; --t2: #2f7fb0;
  --shadow: 0 1px 2px rgba(30,25,10,.08), 0 8px 24px -14px rgba(30,25,10,.25);
} }
:root[data-theme="light"] {
  color-scheme: light;
  --bg: #f1eee6; --panel: #fbfaf6; --panel-2: #f3f0e8; --line: #dcd7cb; --line-strong: #c4bfb1;
  --fg: #1c1a16; --fg-2: #56534b; --fg-3: #8a867c;
  --accent: #a8731a; --accent-ink: #fff;
  --s1: #b8791a; --s2: #2f7fb0; --s3: #4f8f2f;

  --r5: #a8731a; --r4: #3f6f95; --r3: #8a867c; --t1: #b8791a; --t2: #2f7fb0;

}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.45 var(--body); font-variant-numeric: tabular-nums; }
button, input, select { font: inherit; color: inherit; }
a { color: var(--accent); }
.wrap { max-width: 1240px; margin: 0 auto; padding-inline: 16px; padding-block: 18px 48px; }
h1, h2, h3 { font-family: var(--display); margin: 0; text-wrap: balance; letter-spacing: .01em; }
h2 { font-size: 22px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; }
h3 { font-size: 15px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--fg-2); }
.eyebrow { font-family: var(--display); font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .14em; color: var(--fg-3); }
.mono { font-family: var(--mono); }

/* top bar */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.top-in { max-width: 1240px; margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.crest { display: flex; align-items: center; gap: 10px; }
.crest svg { width: 40px; height: 44px; }
.crest .name { font-family: var(--display); font-size: 24px; font-weight: 700; line-height: 1; letter-spacing: .04em; }
.crest .sub { font-size: 11px; color: var(--fg-3); text-transform: uppercase; letter-spacing: .12em; }
.tabs { display: flex; gap: 2px; margin-inline: auto; flex-wrap: wrap; }
.tab { background: none; border: 1px solid transparent; border-radius: 6px; padding: 7px 12px; font-family: var(--display); font-weight: 600; font-size: 15px; text-transform: uppercase; letter-spacing: .08em; color: var(--fg-2); cursor: pointer; }
.tab:hover { color: var(--fg); }
.tab[aria-selected="true"] { color: var(--accent-ink); background: var(--accent); }
.tools { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; min-width: 0; }
@media (max-width: 720px) {
  .top-in { gap: 8px 10px; padding: 8px 12px; }
  .crest .name { font-size: 20px; } .crest svg { width: 32px; height: 36px; }
  .tabs { order: 3; flex: 1 0 100%; flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; margin: 0; padding-bottom: 2px; -webkit-overflow-scrolling: touch; }
  .tabs::-webkit-scrollbar { display: none; }
  .tab { padding: 6px 8px; font-size: 13px; letter-spacing: .05em; flex: none; }
  .tools { margin-left: auto; flex-wrap: nowrap; }
  .search { min-width: 0; flex: 1 1 120px; }
  .search kbd, .sync span:not(:first-child) { display: none; }
  .sync { padding: 3px 6px; }
  .btn { padding: 5px 8px; }
  .gap { grid-template-columns: 1fr; gap: 6px; }
  .gap > div:nth-child(2) { order: -1; }
  .leaders { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
  .tile .big { font-size: 24px; } .tile .delta { font-size: 11px; flex-wrap: wrap; } .tile .spark { max-width: 100%; }
  .wrap { padding-block: 12px 40px; }
  .grid { gap: 10px; }
  .panel { padding: 12px; border-radius: 8px; }
  .slotlist { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
  .nudge { columns: 2 130px; }
  .drawer .card { width: 100%; border-left: 0; }
  th, td { padding: 6px 6px; font-size: 12.5px; }
  .hide-sm { display: none; }                 /* keep #, member, rank, the measure and the Canyon slot on a phone */
  td .bar, td .chip.title { display: none; }  /* the number matters more than the bar when the screen is this narrow */
}
.search { display: flex; align-items: center; gap: 6px; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; min-width: 200px; min-height: 32px; }
.search input { background: none; border: 0; outline: none; width: 100%; color: var(--fg); }
.search kbd { font: 11px var(--mono); color: var(--fg-3); border: 1px solid var(--line-strong); border-radius: 4px; padding: 0 5px; }
.btn { background: var(--panel); border: 1px solid var(--line-strong); border-radius: 6px; padding: 5px 10px; cursor: pointer; font-size: 13px; color: var(--fg); display: inline-flex; gap: 6px; align-items: center; }
.btn:hover { border-color: var(--accent); }
.btn.small { padding: 3px 8px; font-size: 12px; }
.btn.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* panels */
.view[hidden] { display: none; }
.grid { display: grid; gap: 14px; grid-template-columns: repeat(12, 1fr); }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; box-shadow: var(--shadow); min-width: 0; }
.panel > h3 { margin-bottom: 10px; display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.panel > h3 .note { font: 12px var(--body); text-transform: none; letter-spacing: 0; color: var(--fg-3); font-weight: 400; }
.c3 { grid-column: span 3; } .c4 { grid-column: span 4; } .c6 { grid-column: span 6; } .c8 { grid-column: span 8; } .c12 { grid-column: span 12; }
@media (max-width: 900px) { .c3 { grid-column: span 6; } .c4 { grid-column: span 6; } .c8 { grid-column: span 12; } .c6 { grid-column: span 12; } }
@media (max-width: 520px) { .c3 { grid-column: span 6; } .c4 { grid-column: span 12; } }

/* stat tiles */
.tile .eyebrow { margin-bottom: 4px; }
.tile .big { font-family: var(--display); font-size: 34px; font-weight: 700; line-height: 1; letter-spacing: .01em; }
.tile .delta { font-size: 12px; color: var(--fg-2); margin-top: 6px; display: flex; gap: 6px; align-items: center; }
.up { color: var(--good); } .down { color: var(--bad); }
.tile .spark { margin-top: 8px; max-width: 100%; height: auto; }

/* leadership */
.leaders { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.leader { display: flex; gap: 10px; align-items: center; padding: 8px; border-radius: 8px; background: var(--panel-2); cursor: pointer; border: 1px solid transparent; text-align: left; }
.leader:hover { border-color: var(--line-strong); }
.leader .av { width: 44px; height: 48px; flex: none; }
.leader .nm { font-weight: 600; font-size: 13px; line-height: 1.2; overflow-wrap: anywhere; }
.leader .rk { font-size: 11px; color: var(--fg-3); display: flex; gap: 6px; align-items: center; margin-top: 2px; }
.leader .pw { font-size: 12px; color: var(--fg-2); margin-top: 2px; }
.chip { display: inline-block; font-family: var(--display); font-weight: 700; font-size: 11px; letter-spacing: .08em; padding: 0 6px; border-radius: 4px; line-height: 16px; text-transform: uppercase; }
.chip.R5 { background: var(--r5); color: #1a1408; } .chip.R4 { background: var(--r4); color: #0e1a24; } .chip.R3 { background: var(--r3); color: #fff; }
.chip.title { background: transparent; border: 1px solid var(--line-strong); color: var(--fg-2); font-weight: 600; }

/* charts */
.chart { width: 100%; height: auto; display: block; }
.chart text { font-family: var(--body); font-size: 11px; fill: var(--fg-3); }
.chart .lbl { fill: var(--fg-2); }
.chart .lbl-strong { fill: var(--fg); font-weight: 600; }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.chart .axis { stroke: var(--line-strong); stroke-width: 1; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--fg-2); margin-top: 6px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
.tip { position: fixed; z-index: 50; pointer-events: none; background: var(--panel); border: 1px solid var(--line-strong); border-radius: 6px; padding: 6px 9px; font-size: 12px; box-shadow: var(--shadow); max-width: 260px; }
.tip b { display: block; font-weight: 600; }
.tip[hidden] { display: none; }

/* tables */
.tablewrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { padding: 6px 8px; text-align: right; white-space: nowrap; border-bottom: 1px solid var(--line); }
th { position: sticky; top: 0; background: var(--panel); font-family: var(--display); font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--fg-2); cursor: pointer; user-select: none; }
th:hover { color: var(--fg); }
th.sorted { color: var(--accent); }
th[data-arrow]::after { content: attr(data-arrow); }
th:first-child, td:first-child, th.l, td.l { text-align: left; }
tbody tr:hover { background: var(--panel-2); }
tbody tr { cursor: pointer; }
.bar { display: inline-block; height: 8px; border-radius: 2px; background: var(--s1); vertical-align: middle; margin-right: 6px; }
.bar.v { background: var(--s2); margin-right: 0; margin-left: -6px; }
.d-up { color: var(--good); } .d-down { color: var(--bad); } .d-flat { color: var(--fg-3); }
.filters { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 10px; }
.filters select { background: var(--panel-2); border: 1px solid var(--line-strong); border-radius: 6px; padding: 4px 8px; }
.count { color: var(--fg-3); font-size: 12px; margin-left: auto; }

/* canyon */
.team { border-top: 3px solid var(--t1); }
.team.t2 { border-top-color: var(--t2); }
.team .head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.team .head .tot { font-family: var(--display); font-size: 26px; font-weight: 700; }
.slotlist { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 3px 10px; margin-top: 8px; }
.slot { display: flex; justify-content: space-between; gap: 6px; font-size: 12.5px; padding: 3px 6px; border-radius: 4px; }
.slot:hover { background: var(--panel-2); }
.slot .n { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.slot .n.both::after { content: "B"; font: 600 9px var(--display); color: var(--info); margin-left: 4px; vertical-align: super; }
.slot .n.override::before { content: "✎ "; color: var(--warn); }
.slot .v { color: var(--fg-2); }
.gap { display: grid; grid-template-columns: 1fr auto 1fr; gap: 10px; align-items: center; }
.gapbar { height: 14px; border-radius: 4px; background: var(--panel-2); position: relative; overflow: hidden; }
.gapbar i { position: absolute; top: 0; bottom: 0; }
.avail { display: flex; height: 16px; border-radius: 4px; overflow: hidden; gap: 2px; margin: 8px 0; }
.avail i { display: block; }
.mini { display: flex; flex-wrap: wrap; gap: 4px 10px; font-size: 12px; color: var(--fg-2); }
.nudge { columns: 3 150px; column-gap: 14px; font-size: 12.5px; margin-top: 8px; }
.nudge div { break-inside: avoid; display: flex; justify-content: space-between; gap: 6px; padding: 2px 0; }
.nudge .v { color: var(--fg-3); }

/* drawer */
.drawer { position: fixed; inset: 0; z-index: 40; display: flex; justify-content: flex-end; background: rgba(0,0,0,.45); }
.drawer[hidden] { display: none; }
.drawer .card { width: min(440px, 100%); background: var(--panel); border-left: 1px solid var(--line); padding: 18px; overflow-y: auto; padding-top: calc(18px + env(safe-area-inset-top, 0px)); }
.drawer .hd { display: flex; gap: 12px; align-items: center; margin-bottom: 12px; }
.drawer .hd .av { width: 54px; height: 60px; flex: none; }
.drawer .hd h2 { text-transform: none; letter-spacing: 0; font-size: 24px; overflow-wrap: anywhere; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: 13px; margin-top: 12px; }
.kv dt { color: var(--fg-3); } .kv dd { margin: 0; text-align: right; }
.close { margin-left: auto; }
.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 8px 14px; border-radius: 6px; font-size: 13px; z-index: 60; box-shadow: var(--shadow); }
.toast[hidden] { display: none; }
.sync { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--fg-2); border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; white-space: nowrap; }
.sync i { width: 8px; height: 8px; border-radius: 50%; background: var(--fg-3); display: inline-block; }

.edit label { display: flex; flex-direction: column; gap: 4px; font-size: 11px; text-transform: uppercase; letter-spacing: .1em; color: var(--fg-3); font-family: var(--display); font-weight: 600; }
.edit input { background: var(--panel); border: 1px solid var(--line-strong); border-radius: 6px; padding: 6px 8px; font-family: var(--body); text-transform: none; letter-spacing: 0; color: var(--fg); min-width: 0; }
.edit select { background: var(--panel); border: 1px solid var(--line-strong); border-radius: 6px; padding: 6px 8px; font-family: var(--body); text-transform: none; letter-spacing: 0; color: var(--fg); }
.edit .hint { grid-column: 1 / -1; font-size: 12px; color: var(--fg-2); font-family: var(--body); text-transform: none; letter-spacing: 0; }
.slot .n.pending::after { content: "⟳"; color: var(--warn); margin-left: 4px; font-size: 11px; }
.qedit { background: none; border: 0; color: var(--fg-3); cursor: pointer; padding: 0 2px; font-size: 12px; }
.qedit:hover { color: var(--accent); }
.rules h4 { font-family: var(--display); text-transform: uppercase; letter-spacing: .1em; font-size: 13px; color: var(--accent); margin: 14px 0 6px; }
.rules table td { white-space: normal; text-align: left; vertical-align: top; font-size: 13px; }
.rules table td:first-child { font-weight: 600; width: 22%; }
.foot { color: var(--fg-3); font-size: 12px; margin-top: 20px; }
@media (prefers-reduced-motion: no-preference) { .tab, .btn, .leader { transition: background .15s, color .15s, border-color .15s; } }
</style>

// ---------- Canyon model: the same rule the sheet's W17 / S column apply, so edits preview instantly
function sessKey(s){ s = String(s||''); if (/^Either/.test(s)) return 'Either'; if (/^Both/.test(s)) return 'Both'; if (/^N\/A/.test(s)) return 'N/A'; return s.slice(0,5); }

// ---------- charts (SVG strings) - narrower viewBox on phones so labels stay legible
const narrow = () => innerWidth < 720;
const chartW = () => narrow() ? 380 : 640;
function sparkline(vals, w=120, h=28, col='var(--s1)'){
  if (vals.length < 2) return '';
  const min = Math.min(...vals), max = Math.max(...vals), rng = max-min || 1;
  const pts = vals.map((v,i) => [4 + i*(w-8)/(vals.length-1), h-4 - (v-min)/rng*(h-8)]);
  const d = pts.map((p,i) => (i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const last = pts[pts.length-1];
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" aria-hidden="true"><path d="${d} L${last[0].toFixed(1)} ${h} L4 ${h}Z" fill="${col}" opacity=".12"/><path d="${d}" fill="none" stroke="${col}" stroke-width="2" stroke-linejoin="round"/><circle cx="${last[0].toFixed(1)}" cy="${last[1].toFixed(1)}" r="3" fill="${col}" stroke="var(--panel)" stroke-width="2"/></svg>`;
}
function lineChart(series, labels, opts={}){
  const W = chartW(), H = narrow() ? 190 : 220, L = narrow() ? 46 : 54, R = 16, T = 14, B = 30;
  const all = series.flatMap(s => s.vals); const min = Math.min(...all), max = Math.max(...all);
  const pad = (max-min)*0.15 || max*0.05 || 1; const y0 = min - pad, y1 = max + pad;
  const x = i => L + i*(W-L-R)/Math.max(1, labels.length-1), y = v => T + (H-T-B) - (v-y0)/(y1-y0)*(H-T-B);
  const ticks = 4; let g = '';
  for (let k=0;k<=ticks;k++){ const v = y0 + (y1-y0)*k/ticks; g += `<line class="grid" x1="${L}" x2="${W-R}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}"/><text x="${L-6}" y="${(y(v)+4).toFixed(1)}" text-anchor="end">${fmtM(v)}</text>`; }
  labels.forEach((lb,i) => { g += `<text x="${x(i).toFixed(1)}" y="${H-10}" text-anchor="middle">${esc(lb)}</text>`; });
  series.forEach(s => {
    const d = s.vals.map((v,i) => (i?'L':'M')+x(i).toFixed(1)+' '+y(v).toFixed(1)).join(' ');
    g += `<path d="${d}" fill="none" stroke="${s.col}" stroke-width="2" stroke-linejoin="round"/>`;
    s.vals.forEach((v,i) => { g += `<circle cx="${x(i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="${i===s.vals.length-1?4.5:3.5}" fill="${s.col}" stroke="var(--panel)" stroke-width="2" data-tip="${esc(s.name)}|${esc(labels[i])}: ${fmt(v)}"/>`; });
    const li = s.vals.length-1; g += `<text class="lbl-strong" x="${(x(li)-8).toFixed(1)}" y="${(y(s.vals[li])-10).toFixed(1)}" text-anchor="end">${fmtM(s.vals[li])}</text>`;
  });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opts.label||'')}">${g}</svg>`;
}
function hbars(rows, opts={}){ // rows: {label, segs:[{v,col,name}], total, sub}
  const W = opts.W ? Math.min(opts.W, chartW()) : chartW(), LW = Math.min(opts.labelW || 120, narrow() ? 90 : 120), RW = 56, rh = 22, H = rows.length*rh + 6;
  const max = Math.max(...rows.map(r => r.total)); const sx = v => v/max*(W-LW-RW-8);
  let g = '';
  rows.forEach((r,i) => {
    const y = 3 + i*rh; let x = LW;
    g += `<text class="lbl" x="${LW-8}" y="${y+14}" text-anchor="end">${esc(narrow() && r.label.length > 13 ? r.label.slice(0,12)+'…' : r.label)}</text>`;
    r.segs.forEach((s,k) => { const w = Math.max(0, sx(s.v) - (k?2:0)); g += `<rect x="${(x+(k?2:0)).toFixed(1)}" y="${y+4}" width="${w.toFixed(1)}" height="14" rx="${k===r.segs.length-1?3:0}" fill="${s.col}" data-tip="${esc(r.label)}|${esc(s.name)}: ${fmt(s.v)}${r.sub?' · '+esc(r.sub):''}"/>`; x += sx(s.v); });
    g += `<text class="lbl-strong" x="${(x+6).toFixed(1)}" y="${y+15}">${fmtM(r.total)}</text>`;
  });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opts.label||'')}">${g}</svg>`;
}
function divergeBars(rows, opts={}){ // rows: {label, v}
  const W = chartW(), LW = narrow() ? 96 : 130, rh = 22, H = rows.length*rh + 6, allNeg = rows.length > 0 && (rows.every(r => r.v < 0) || rows.every(r => r.v >= 0)), mid = allNeg ? LW : LW + (W-LW-70)/2;
  // One-sided lists (all gains or all declines) read like the gains list: axis at the names, red bars growing right by size of the drop.
  const max = Math.max(...rows.map(r => Math.abs(r.v))) || 1; const sx = v => Math.abs(v)/max*(allNeg ? W - LW - 70 : (W-LW-70)/2 - 4);
  let g = `<line class="axis" x1="${mid}" x2="${mid}" y1="0" y2="${H}"/>`;
  rows.forEach((r,i) => {
    const y = 3 + i*rh, w = sx(r.v), pos = r.v >= 0 || allNeg;
    g += `<text class="lbl" x="${LW-8}" y="${y+14}" text-anchor="end">${esc(narrow() && r.label.length > 13 ? r.label.slice(0,12)+'…' : r.label)}</text>`;
    g += `<rect x="${(pos?mid+1:mid-1-w).toFixed(1)}" y="${y+4}" width="${w.toFixed(1)}" height="14" rx="3" fill="${r.v >= 0?'var(--good)':'var(--bad)'}" data-tip="${esc(r.label)}|${signed(r.v)} (${r.sub||''})"/>`;
    g += `<text class="lbl-strong" x="${(pos?mid+w+7:mid-w-7).toFixed(1)}" y="${y+15}" text-anchor="${pos?'start':'end'}">${signed(r.v)}</text>`;
  });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opts.label||'')}">${g}</svg>`;
}

// ---------- canyon
function canyonSummary(){
  const teams = { T1: [], T2: [] }, hvOf = n => pw(latest.find(m => m.name === n));   // p.hv below = the chosen measure
  D.canyon.forEach(c => { const f = c.final || ''; const t = f.startsWith('T1') ? 'T1' : f.startsWith('T2') ? 'T2' : null; if (t) teams[t].push({ ...c, hv: hvOf(c.name), starter: f.endsWith('Starter') }); });
  Object.values(teams).forEach(a => a.sort((x,y) => y.hv - x.hv));
  const st = t => sum(teams[t].filter(p => p.starter), p => p.hv);
  const s1 = st('T1'), s2 = st('T2'), gap = s1 - s2, strong = gap >= 0 ? 'Team 1' : 'Team 2';
  const gapPct = (s1 || s2) ? Math.abs(gap)/Math.max(s1,s2)*100 : null;
  return { teams, s1, s2, gap, gapPct, strong };
}

// ---------- trends (metric picker: hero / vehicle / science / structure / arena / troops / kills / total, singly or combined)
const TMET = [['hero','Hero'],['veh','Vehicle'],['tech','Science'],['struct','Structure'],['arena','Arena'],['troop','Troops'],['kills','Kills'],['total','Total']];

let TCOMB = ls.get('jtb-tcomb') !== '0', TFROM = ls.get('jtb-tfrom') || '';
const tv = m => TM.reduce((s,k) => s + ((m && m[k]) || 0), 0);

const tok = q => q && TM.every(k => k !== 'arena' || q.arena);

  const both = delta(fMap), up = both.filter(x => x.v > 0).slice(0, 10), down = both.filter(x => x.v < 0).slice(-10).reverse();
  const fRows = (byDate[from]||[]).filter(r => tok(r)), nRows = latest.filter(r => tok(r));
  const tFrom = sum(fRows, tv), tNow = sum(nRows, tv), stay = latest.filter(m => tok(m) && tok(fMap[m.name]));
  const sFrom = sum(stay, m => tv(fMap[m.name])), sNow = sum(stay, tv);

      <label class="count">From <select id="tfrom">${dates.slice(0,-1).filter(d => d >= fd).map(d => `<option value="${d}" ${d===from?'selected':''}>${dShort(d)}${d===fd?' (first)':''}</option>`).join('')}</select> to ${dShort(LATEST)}</label></div>
      ${TM.includes('arena') ? `<p class="count" style="margin:8px 0 0">Arena power is only recorded from ${dShort(dates.find(d => byDate[d].some(r => r.arena)) || LATEST)} on, so its history starts there.</p>` : ''}</div>

  const v = $('#view-rivals');

// ---------- member drawer
function openMember(name){

  const ah = h.filter(x => x.arena), useArena = BY_ARENA && ah.length > 1;

      ${WEB ? `<label>Passcode<input id="ed-code" type="password" autocomplete="off" placeholder="member or officer code" value="${esc(code)}"></label><label>Your name<input id="ed-by" type="text" autocomplete="off" maxlength="40" placeholder="who is changing this" value="${esc(who)}"></label>` : ''}

  if (!READONLY || WEB) { $('#ed-avail').onchange = e => applyEdit(name, { avail: e.target.value }); $('#ed-slot').onchange = e => applyEdit(name, { slot: e.target.value }); }

function closeDrawer(){ $('#drawer').hidden = true; }
$('#drawer').addEventListener('click', e => { if (e.target === $('#drawer')) closeDrawer(); });

// ---------- editing: apply locally, preview the new split, queue the change for the sheet
const pending = {};          // name -> {avail?, slot?} not yet confirmed by board_data.json
let queue = [], flushT = null, mcp = null, syncState = { mode: 'snapshot', at: null, err: null };
function autoSlotOf(c){ const keep = c.manual; c.manual = false; recompute(); const s = c.final || 'not placed'; c.manual = keep; recompute(); return s; }
let code = ls.get('jtb-code') || '', who = ls.get('jtb-who') || '', role = null, codeState = 'none';
async function checkCode(){
  if (!WEB || !code) { role = null; codeState = 'none'; return; }
  codeState = 'checking';
  try { const r = await fetch(API_URL + '/whoami', { headers: { 'X-Code': code } }); role = r.ok ? (await r.json()).role : null; codeState = r.ok ? 'ok' : 'bad'; if (!r.ok) toast('That passcode is not recognised'); }
  catch (e) { role = null; codeState = 'offline'; }
  const h = $('#ed-hint'); if (h) h.textContent = editHint('');
}
function editHint(name){
  if (WEB) { if (!code) return 'Enter the alliance passcode to set availability; officers use the officer code to change slots. Changes reach the sheet within a minute.'; if (role === 'officer') return 'Officer code accepted: you can change availability and slots.'; if (role === 'member') return 'Member code accepted: you can set availability. Slots need the officer code.'; if (codeState === 'bad') return 'That passcode is not recognised. Ask an officer for the current alliance code.'; if (codeState === 'offline') return 'Could not reach the board API to check that passcode. Try again in a moment.'; return 'Checking passcode…'; }
  if (!mcp) return 'Google Drive is not connected in this view, so changes stay here as a preview. Connect Google Drive on claude.ai and reopen to sync with the sheet.';
  return pending[name] ? 'Change sent. The sheet picks it up within a minute and the board follows.' : 'Changes go to the Canyon Teams sheet within a minute. Teams re-split right away as a preview.';
}
function applyEdit(name, e){
  const c = canyonMap[name]; if (!c) return;
  if (e.avail !== undefined) c.avail = e.avail;
  if (e.slot !== undefined) { if (e.slot === 'auto') { c.manual = false; c.override = ''; } else { c.manual = true; c.override = e.slot; } }
  recompute();
  pending[name] = Object.assign(pending[name] || {}, e);
  queue.push({ name, ...e });
  clearTimeout(flushT); flushT = setTimeout(flush, 1200);
  renderAll(); if (!$('#drawer').hidden) { const h = $('#ed-hint'); if (h) h.textContent = editHint(name); const sl = $('#ed-slot'); if (sl) sl.options[0].textContent = 'Auto (' + (c.manual ? autoSlotOf(c) : (c.final||'not placed')) + ')'; }
  updateSync();
}
async function flush(){
  if (!queue.length) return;
  const edits = queue; queue = [];
  if (WEB) {
    if (!code) { edits.forEach(x => { delete pending[x.name]; }); toast('Enter a passcode first'); updateSync(); return; }
    for (const x of edits) {
      try {
        const r = await fetch(API_URL + '/edit', { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Code': code }, body: JSON.stringify({ name: x.name, avail: x.avail, slot: x.slot, by: who || undefined }) });
        const j = await r.json().catch(() => ({}));
        if (!r.ok) { delete pending[x.name]; toast(j.error === 'bad code' ? 'That passcode is not recognised' : j.error === 'slots need the officer code' ? 'Slots need the officer code' : 'Not saved: ' + (j.error || r.status)); syncState.err = null; }
        else { syncState.err = null; toast('Sent to the sheet'); }
      } catch (err) { delete pending[x.name]; syncState.err = 'offline'; toast('Could not reach the board API'); }
    }
    if (Object.keys(pending).length === 0) { await refreshWeb(); } updateSync(); return;
  }
  if (!mcp) { updateSync(); return; }
  const body = JSON.stringify({ edits, by: 'command board', at: new Date().toISOString() });
  try {
    await mcp.callTool(DRIVE, 'create_file', { title: 'edit_' + Date.now() + '.json', parentId: INBOX_ID, contentMimeType: 'application/json', disableConversionToGoogleType: true, textContent: body });
    syncState.err = null; toast('Sent to the sheet');
  } catch (err) {
    syncState.err = err && err.code ? err.code : 'error';
    edits.forEach(x => { delete pending[x.name]; });
    toast(syncState.err === 'needs_reauth' ? 'Google Drive needs to be reconnected' : syncState.err === 'server_not_connected' ? 'Google Drive is not connected' : 'Could not send to the sheet (' + syncState.err + ')');
  }
  updateSync();
}
function updateSync(){
  const el = $('#sync'), n = Object.keys(pending).length;
  const t = syncState.at ? new Date(syncState.at).toLocaleTimeString('en-US', {hour:'numeric', minute:'2-digit'}) : '';
  if (syncState.err && !n) { el.className = 'sync err'; el.lastElementChild.textContent = syncState.err === 'needs_reauth' ? 'Drive: reconnect' : syncState.err === 'server_not_connected' ? 'Drive not connected' : syncState.err === 'offline' ? 'Board API unreachable' : 'Sync error'; }
  else if (n) { el.className = 'sync pending'; el.lastElementChild.textContent = n + ' change' + (n>1?'s':'') + ' syncing'; }
  else if (syncState.mode === 'live') { el.className = 'sync live'; el.lastElementChild.textContent = 'Live · ' + t; }
  else if (syncState.mode === 'preview') { el.className = 'sync pending'; el.lastElementChild.textContent = 'Preview only'; }
  else { el.className = 'sync'; el.lastElementChild.textContent = 'Snapshot ' + dShort(LATEST); }
}
function decodePayload(p){
  if (p == null) return null;
  if (typeof p === 'string') { try { p = JSON.parse(p); } catch (e) { return null; } }
  const b64 = p.content; if (!b64) return null;
  const bin = atob(String(b64).replace(/\s/g, '')); const bytes = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  try { return JSON.parse(new TextDecoder('utf-8').decode(bytes)); } catch (e) { return null; }
}
function adopt(fresh, storedAt){
  if (!fresh || !fresh.history || !fresh.canyon) return;
  // drop pending edits the sheet now reflects; re-apply the rest on top of the fresh data
  fresh.canyon.forEach(c => { const p = pending[c.name]; if (!p) return;
    const okA = p.avail === undefined || c.avail === p.avail, okS = p.slot === undefined || (p.slot === 'auto' ? !c.manual : (c.manual && c.final === p.slot));
    if (okA && okS) delete pending[c.name]; });
  D = fresh; prep();
  const left = Object.keys(pending);
  if (left.length) { left.forEach(n => { const c = canyonMap[n], p = pending[n]; if (!c) { delete pending[n]; return; } if (p.avail !== undefined) c.avail = p.avail; if (p.slot !== undefined) { if (p.slot === 'auto') { c.manual = false; c.override = ''; } else { c.manual = true; c.override = p.slot; } } }); recompute(); }
  syncState.mode = 'live'; syncState.at = storedAt || Date.now();
  $('#crest .sub').textContent = (READONLY ? 'Alliance board' : 'Command board') + ' · snapshot ' + dShort(LATEST);
  $('#foot').textContent = footText();
  renderAll(); updateSync();
}
async function refreshWeb(){
  try { const r = await fetch(API_URL + '/data', { cache: 'no-store' }); if (!r.ok) throw new Error(r.status); const j = await r.json(); adopt(j, Date.parse(j.generated) || Date.now()); syncState.err = null; }
  catch (e) { syncState.err = syncState.mode === 'live' ? null : 'offline'; updateSync(); }
}
async function connect(){
  if (WEB) { await refreshWeb(); setInterval(() => { if (!document.hidden) refreshWeb(); }, 45000); document.addEventListener('visibilitychange', () => { if (!document.hidden) refreshWeb(); }); return; }
  if (READONLY) { syncState.mode = 'snapshot'; updateSync(); return; }
  try { mcp = window.claude && window.claude.use ? await window.claude.use('mcp') : null; } catch (e) { mcp = null; }
  if (!mcp) { updateSync(); return; }
  mcp.watchTool(DRIVE, 'download_file_content', { fileId: BOARD_DATA_ID }, ev => {
    if (ev.type === 'data') { const j = decodePayload(ev.result && (ev.result.payload !== undefined ? ev.result.payload : ev.result)); if (j) adopt(j, ev.result.cache && ev.result.cache.storedAt); }
    else if (ev.type === 'error') { const code = ev.error && ev.error.code; if (['needs_reauth','server_not_connected','blocked_by_policy','approval_required'].includes(code)) { syncState.err = code; } updateSync(); }
  }, { refetchInterval: 45000 });
}
connect();
window.__jtb = { get D(){ return D; }, recompute, applyEdit, canyonSummary };

// ---------- utilities
function copy(text, msg){
  const done = () => toast(msg);
  const fallback = () => { const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); done(); } catch(e) { toast('Select and copy manually'); } ta.remove(); };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, fallback); else fallback();
}
let toastT; function toast(msg){ const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 1800); }

// ---------- tabs, search, toggles
const views = { overview: renderOverview, roster: renderRoster, canyon: renderCanyon, trends: renderTrends, champion: renderChampion, alliances: renderAlliances, rivals: renderRivals, rules: renderRules };
let current = null;
function show(v){
  if (!views[v]) v = 'overview';
  current = v; ls.set('jtb-tab', v);
  document.querySelectorAll('.tab').forEach(t => t.setAttribute('aria-selected', t.dataset.view === v));
  document.querySelectorAll('.view').forEach(s => s.hidden = s.id !== 'view-' + v);
  views[v](); sortable();
}
function renderAll(){ views[current](); sortable(); }
// Every table without its own sort (Roster and Champion Duel keep theirs) sorts by clicking a header.
// The choice is remembered per table, so re-renders keep the order.
const TSORT = {}, coll = new Intl.Collator(undefined, { numeric: true, sensitivity: 'base' });
function cellVal(td){
  if (!td) return null;
  const t = (td.dataset.v != null ? td.dataset.v : td.textContent).trim().replace(/−/g, '-').replace(/,/g, '');
  if (t === '' || t === '—' || t === '-') return null;
  const m = t.match(/^([+-]?\d*\.?\d+)\s*([KMB])?%?$/i);
  if (m) return +m[1] * ({ k: 1e3, m: 1e6, b: 1e9 }[(m[2] || '').toLowerCase()] || 1);
  const w = t.match(/^(\d+)\s*[–-]\s*(\d+)$/); if (w) return +w[1] - +w[2] / 1000;
  return t;
}
function sortable(){
  const root = $('#view-' + current); if (!root) return;
  root.querySelectorAll('table').forEach((tb, ti) => {
    const ths = [...tb.querySelectorAll('thead th')]; if (!ths.length || ths.some(h => h.dataset.sort || h.dataset.cs)) return;
    const key = current + ':' + (tb.dataset.skey || ti), body = tb.tBodies[0]; if (!body) return;
    const apply = () => {
      const st = TSORT[key]; ths.forEach((h, i) => { h.classList.toggle('sorted', !!st && st.c === i); h.dataset.arrow = st && st.c === i ? (st.d < 0 ? ' ▾' : ' ▴') : ''; });
      if (!st) return;
      const rows = [...body.rows], vals = new Map(rows.map(r => [r, cellVal(r.cells[st.c])]));
      const num = [...vals.values()].every(v => v == null || typeof v === 'number'); // a column is numeric only if every cell is
      if (!num) rows.forEach(r => { const td = r.cells[st.c]; vals.set(r, vals.get(r) == null ? null : (td.dataset.v ?? td.textContent).trim()); });
      rows.sort((a, b) => { const x = vals.get(a), y = vals.get(b); if (x == null || y == null) return (x == null) - (y == null); return (num ? x - y : coll.compare(x, y)) * st.d; });
      rows.forEach(r => body.appendChild(r));
    };
    ths.forEach((h, i) => { h.title = 'Sort'; h.onclick = () => { const st = TSORT[key]; if (st && st.c === i) st.d *= -1; else { const vs = [...body.rows].map(r => cellVal(r.cells[i])).filter(x => x != null), rankish = /^#$|rank/i.test(h.textContent.trim()); TSORT[key] = { c: i, d: vs.length && vs.every(x => typeof x === 'number') && !rankish ? -1 : 1 }; } apply(); }; });
    apply();
  });
}
$('#tabs').addEventListener('click', e => { const t = e.target.closest('.tab'); if (t) show(t.dataset.view); });
$('#q').addEventListener('input', () => { if (current !== 'roster') show('roster'); else renderRoster(); });
$('#q').addEventListener('keydown', e => { if (e.key === 'Enter') { const q = $('#q').value.trim().toLowerCase(); const m = latest.find(x => x.name.toLowerCase() === q) || latest.find(x => x.name.toLowerCase().includes(q)); if (m) openMember(m.name); } });
$('#unit').textContent = compact ? 'M' : '#';
$('#unit').onclick = () => { compact = !compact; ls.set('jtb-unit', compact ? 'compact' : 'full'); $('#unit').textContent = compact ? 'M' : '#'; renderAll(); };
$('#theme').onclick = () => { const r = document.documentElement, cur = r.getAttribute('data-theme'); const dark = cur ? cur === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches; r.setAttribute('data-theme', dark ? 'light' : 'dark'); };
const footText = () => `Data: JTB 293 Power Tracker, snapshot ${dLong(LATEST)} (${A.n} members, ${dates.length} snapshots since ${dShort(dates[0])}). Ranking and the Canyon balance use ${MLONG}${BY_ARENA ? ', the measure set in Canyon Teams C9' : ' because total power swings with troop rebuilds'}; growth charts stay on hero + vehicle, the only measure with history before Oct 5. ${WEB ? 'Open any member to set availability (alliance passcode) or a slot (officer passcode); changes reach the Canyon Teams sheet within a minute.' : READONLY ? 'This is the shared read-only copy; officers edit availability and slots on the command board.' : 'Availability and slot edits made here go to the Canyon Teams sheet through your Google Drive connection.'} Avatars are rank shields standing in for in-game portraits.`;
$('#foot').textContent = footText(); updateSync();
let wasNarrow = narrow(); addEventListener('resize', () => { if (narrow() !== wasNarrow) { wasNarrow = narrow(); renderAll(); } });
const hash = location.hash.replace('#','');
show(views[hash] ? hash : (ls.get('jtb-tab') || 'overview'));
})();
