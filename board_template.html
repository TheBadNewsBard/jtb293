<title>/*__TITLE__*/JTB 293 Command Board</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: dark-first command console. Sticky top bar with tabs; each tab is a grid of panels.
   Summary tiles and leadership strip first, detail tables below. */
:root {
  color-scheme: dark;
  --bg: #121517; --panel: #1b2024; --panel-2: #22282d; --line: #2e363c; --line-strong: #3d474f;
  --fg: #e8e4d9; --fg-2: #a9a498; --fg-3: #75716a;
  --accent: #d9a441; --accent-ink: #1a1408;
  --s1: #bf7d1a; --s2: #3f95cf; --s3: #5f9e38;           /* validated categorical: hero, vehicle, other */
  --good: #5f9e38; --warn: #d9a441; --bad: #d95c4a; --info: #3f95cf;
  --r5: #e0b04a; --r4: #8fb8d8; --r3: #6b7480;
  --t1: #bf7d1a; --t2: #3f95cf;
  --shadow: 0 1px 0 rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.6);
  --display: "Rajdhani", "Arial Narrow", sans-serif;
  --body: "IBM Plex Sans", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) {
  color-scheme: light;
  --bg: #f1eee6; --panel: #fbfaf6; --panel-2: #f3f0e8; --line: #dcd7cb; --line-strong: #c4bfb1;
  --fg: #1c1a16; --fg-2: #56534b; --fg-3: #8a867c;
  --accent: #a8731a; --accent-ink: #fff;
  --s1: #b8791a; --s2: #2f7fb0; --s3: #4f8f2f;
  --good: #3e8a2a; --warn: #a8731a; --bad: #c2412f; --info: #2f7fb0;
  --r5: #a8731a; --r4: #3f6f95; --r3: #8a867c; --t1: #b8791a; --t2: #2f7fb0;
  --shadow: 0 1px 2px rgba(30,25,10,.08), 0 8px 24px -14px rgba(30,25,10,.25);
} }
:root[data-theme="light"] {
  color-scheme: light;
  --bg: #f1eee6; --panel: #fbfaf6; --panel-2: #f3f0e8; --line: #dcd7cb; --line-strong: #c4bfb1;
  --fg: #1c1a16; --fg-2: #56534b; --fg-3: #8a867c;
  --accent: #a8731a; --accent-ink: #fff;
  --s1: #b8791a; --s2: #2f7fb0; --s3: #4f8f2f;
  --good: #3e8a2a; --warn: #a8731a; --bad: #c2412f; --info: #2f7fb0;
  --r5: #a8731a; --r4: #3f6f95; --r3: #8a867c; --t1: #b8791a; --t2: #2f7fb0;
  --shadow: 0 1px 2px rgba(30,25,10,.08), 0 8px 24px -14px rgba(30,25,10,.25);
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.45 var(--body); font-variant-numeric: tabular-nums; }
button, input, select { font: inherit; color: inherit; }
a { color: var(--accent); }
.wrap { max-width: 1240px; margin: 0 auto; padding-inline: 16px; padding-block: 18px 48px; }
h1, h2, h3 { font-family: var(--display); margin: 0; text-wrap: balance; letter-spacing: .01em; }
h2 { font-size: 22px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; }
h3 { font-size: 15px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--fg-2); }
.eyebrow { font-family: var(--display); font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .14em; color: var(--fg-3); }
.mono { font-family: var(--mono); }

/* top bar */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.top-in { max-width: 1240px; margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.crest { display: flex; align-items: center; gap: 10px; }
.crest svg { width: 40px; height: 44px; }
.crest .name { font-family: var(--display); font-size: 24px; font-weight: 700; line-height: 1; letter-spacing: .04em; }
.crest .sub { font-size: 11px; color: var(--fg-3); text-transform: uppercase; letter-spacing: .12em; }
.tabs { display: flex; gap: 2px; margin-inline: auto; flex-wrap: wrap; }
.tab { background: none; border: 1px solid transparent; border-radius: 6px; padding: 7px 12px; font-family: var(--display); font-weight: 600; font-size: 15px; text-transform: uppercase; letter-spacing: .08em; color: var(--fg-2); cursor: pointer; }
.tab:hover { color: var(--fg); }
.tab[aria-selected="true"] { color: var(--accent-ink); background: var(--accent); }
.tools { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; min-width: 0; }
@media (max-width: 720px) {
  .top-in { gap: 8px 10px; padding: 8px 12px; }
  .crest .name { font-size: 20px; } .crest svg { width: 32px; height: 36px; }
  .tabs { order: 3; flex: 1 0 100%; flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; margin: 0; padding-bottom: 2px; -webkit-overflow-scrolling: touch; }
  .tabs::-webkit-scrollbar { display: none; }
  .tab { padding: 6px 8px; font-size: 13px; letter-spacing: .05em; flex: none; }
  .tools { margin-left: auto; flex-wrap: nowrap; }
  .search { min-width: 0; flex: 1 1 120px; }
  .search kbd, .sync span:not(:first-child) { display: none; }
  .sync { padding: 3px 6px; }
  .btn { padding: 5px 8px; }
  .gap { grid-template-columns: 1fr; gap: 6px; }
  .gap > div:nth-child(2) { order: -1; }
  .leaders { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
  .tile .big { font-size: 24px; } .tile .delta { font-size: 11px; flex-wrap: wrap; } .tile .spark { max-width: 100%; }
  .wrap { padding-block: 12px 40px; }
  .grid { gap: 10px; }
  .panel { padding: 12px; border-radius: 8px; }
  .slotlist { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
  .nudge { columns: 2 130px; }
  .drawer .card { width: 100%; border-left: 0; }
  th, td { padding: 6px 6px; font-size: 12.5px; }
  .hide-sm { display: none; }                 /* keep #, member, rank, the measure and the Canyon slot on a phone */
  td .bar, td .chip.title { display: none; }  /* the number matters more than the bar when the screen is this narrow */
}
.search { display: flex; align-items: center; gap: 6px; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; min-width: 200px; min-height: 32px; }
.search input { background: none; border: 0; outline: none; width: 100%; color: var(--fg); }
.search kbd { font: 11px var(--mono); color: var(--fg-3); border: 1px solid var(--line-strong); border-radius: 4px; padding: 0 5px; }
.btn { background: var(--panel); border: 1px solid var(--line-strong); border-radius: 6px; padding: 5px 10px; cursor: pointer; font-size: 13px; color: var(--fg); display: inline-flex; gap: 6px; align-items: center; }
.btn:hover { border-color: var(--accent); }
.btn.small { padding: 3px 8px; font-size: 12px; }
.btn.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* panels */
.view[hidden] { display: none; }
.grid { display: grid; gap: 14px; grid-template-columns: repeat(12, 1fr); }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; box-shadow: var(--shadow); min-width: 0; }
.panel > h3 { margin-bottom: 10px; display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.panel > h3 .note { font: 12px var(--body); text-transform: none; letter-spacing: 0; color: var(--fg-3); font-weight: 400; }
.c3 { grid-column: span 3; } .c4 { grid-column: span 4; } .c6 { grid-column: span 6; } .c8 { grid-column: span 8; } .c12 { grid-column: span 12; }
@media (max-width: 900px) { .c3 { grid-column: span 6; } .c4 { grid-column: span 6; } .c8 { grid-column: span 12; } .c6 { grid-column: span 12; } }
@media (max-width: 520px) { .c3 { grid-column: span 6; } .c4 { grid-column: span 12; } }

/* stat tiles */
.tile .eyebrow { margin-bottom: 4px; }
.tile .big { font-family: var(--display); font-size: 34px; font-weight: 700; line-height: 1; letter-spacing: .01em; }
.tile .delta { font-size: 12px; color: var(--fg-2); margin-top: 6px; display: flex; gap: 6px; align-items: center; }
.up { color: var(--good); } .down { color: var(--bad); }
.tile .spark { margin-top: 8px; max-width: 100%; height: auto; }

/* leadership */
.leaders { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.leader { display: flex; gap: 10px; align-items: center; padding: 8px; border-radius: 8px; background: var(--panel-2); cursor: pointer; border: 1px solid transparent; text-align: left; }
.leader:hover { border-color: var(--line-strong); }
.leader .av { width: 44px; height: 48px; flex: none; }
.leader .nm { font-weight: 600; font-size: 13px; line-height: 1.2; overflow-wrap: anywhere; }
.leader .rk { font-size: 11px; color: var(--fg-3); display: flex; gap: 6px; align-items: center; margin-top: 2px; }
.leader .pw { font-size: 12px; color: var(--fg-2); margin-top: 2px; }
.chip { display: inline-block; font-family: var(--display); font-weight: 700; font-size: 11px; letter-spacing: .08em; padding: 0 6px; border-radius: 4px; line-height: 16px; text-transform: uppercase; }
.chip.R5 { background: var(--r5); color: #1a1408; } .chip.R4 { background: var(--r4); color: #0e1a24; } .chip.R3 { background: var(--r3); color: #fff; }
.chip.title { background: transparent; border: 1px solid var(--line-strong); color: var(--fg-2); font-weight: 600; }

/* charts */
.chart { width: 100%; height: auto; display: block; }
.chart text { font-family: var(--body); font-size: 11px; fill: var(--fg-3); }
.chart .lbl { fill: var(--fg-2); }
.chart .lbl-strong { fill: var(--fg); font-weight: 600; }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.chart .axis { stroke: var(--line-strong); stroke-width: 1; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--fg-2); margin-top: 6px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
.tip { position: fixed; z-index: 50; pointer-events: none; background: var(--panel); border: 1px solid var(--line-strong); border-radius: 6px; padding: 6px 9px; font-size: 12px; box-shadow: var(--shadow); max-width: 260px; }
.tip b { display: block; font-weight: 600; }
.tip[hidden] { display: none; }

/* tables */
.tablewrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { padding: 6px 8px; text-align: right; white-space: nowrap; border-bottom: 1px solid var(--line); }
th { position: sticky; top: 0; background: var(--panel); font-family: var(--display); font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--fg-2); cursor: pointer; user-select: none; }
th:hover { color: var(--fg); }
th.sorted { color: var(--accent); }
th[data-arrow]::after { content: attr(data-arrow); }
th:first-child, td:first-child, th.l, td.l { text-align: left; }
tbody tr:hover { background: var(--panel-2); }
tbody tr { cursor: pointer; }
.bar { display: inline-block; height: 8px; border-radius: 2px; background: var(--s1); vertical-align: middle; margin-right: 6px; }
.bar.v { background: var(--s2); margin-right: 0; margin-left: -6px; }
.d-up { color: var(--good); } .d-down { color: var(--bad); } .d-flat { color: var(--fg-3); }
.filters { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 10px; }
.filters select { background: var(--panel-2); border: 1px solid var(--line-strong); border-radius: 6px; padding: 4px 8px; }
.count { color: var(--fg-3); font-size: 12px; margin-left: auto; }

/* canyon */
.team { border-top: 3px solid var(--t1); }
.team.t2 { border-top-color: var(--t2); }
.team .head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.team .head .tot { font-family: var(--display); font-size: 26px; font-weight: 700; }
.slotlist { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 3px 10px; margin-top: 8px; }
.slot { display: flex; justify-content: space-between; gap: 6px; font-size: 12.5px; padding: 3px 6px; border-radius: 4px; }
.slot:hover { background: var(--panel-2); }
.slot .n { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.slot .n.both::after { content: "B"; font: 600 9px var(--display); color: var(--info); margin-left: 4px; vertical-align: super; }
.slot .n.override::before { content: "✎ "; color: var(--warn); }
.slot .v { color: var(--fg-2); }
.gap { display: grid; grid-template-columns: 1fr auto 1fr; gap: 10px; align-items: center; }
.gapbar { height: 14px; border-radius: 4px; background: var(--panel-2); position: relative; overflow: hidden; }
.gapbar i { position: absolute; top: 0; bottom: 0; }
.avail { display: flex; height: 16px; border-radius: 4px; overflow: hidden; gap: 2px; margin: 8px 0; }
.avail i { display: block; }
.mini { display: flex; flex-wrap: wrap; gap: 4px 10px; font-size: 12px; color: var(--fg-2); }
.nudge { columns: 3 150px; column-gap: 14px; font-size: 12.5px; margin-top: 8px; }
.nudge div { break-inside: avoid; display: flex; justify-content: space-between; gap: 6px; padding: 2px 0; }
.nudge .v { color: var(--fg-3); }

/* drawer */
.drawer { position: fixed; inset: 0; z-index: 40; display: flex; justify-content: flex-end; background: rgba(0,0,0,.45); }
.drawer[hidden] { display: none; }
.drawer .card { width: min(440px, 100%); background: var(--panel); border-left: 1px solid var(--line); padding: 18px; overflow-y: auto; padding-top: calc(18px + env(safe-area-inset-top, 0px)); }
.drawer .hd { display: flex; gap: 12px; align-items: center; margin-bottom: 12px; }
.drawer .hd .av { width: 54px; height: 60px; flex: none; }
.drawer .hd h2 { text-transform: none; letter-spacing: 0; font-size: 24px; overflow-wrap: anywhere; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: 13px; margin-top: 12px; }
.kv dt { color: var(--fg-3); } .kv dd { margin: 0; text-align: right; }
.close { margin-left: auto; }
.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 8px 14px; border-radius: 6px; font-size: 13px; z-index: 60; box-shadow: var(--shadow); }
.toast[hidden] { display: none; }
.sync { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--fg-2); border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; white-space: nowrap; }
.sync i { width: 8px; height: 8px; border-radius: 50%; background: var(--fg-3); display: inline-block; }
.sync.live i { background: var(--good); } .sync.pending i { background: var(--warn); } .sync.err i { background: var(--bad); }
.edit { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; padding: 12px; border-radius: 8px; background: var(--panel-2); }
.edit label { display: flex; flex-direction: column; gap: 4px; font-size: 11px; text-transform: uppercase; letter-spacing: .1em; color: var(--fg-3); font-family: var(--display); font-weight: 600; }
.edit input { background: var(--panel); border: 1px solid var(--line-strong); border-radius: 6px; padding: 6px 8px; font-family: var(--body); text-transform: none; letter-spacing: 0; color: var(--fg); min-width: 0; }
.edit select { background: var(--panel); border: 1px solid var(--line-strong); border-radius: 6px; padding: 6px 8px; font-family: var(--body); text-transform: none; letter-spacing: 0; color: var(--fg); }
.edit .hint { grid-column: 1 / -1; font-size: 12px; color: var(--fg-2); font-family: var(--body); text-transform: none; letter-spacing: 0; }
.clearbox { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end; margin-top: 12px; padding: 12px; border-radius: 8px; background: var(--panel-2); border: 1px solid var(--line-strong); }
.clearbox label { display: flex; flex-direction: column; gap: 4px; font-size: 11px; text-transform: uppercase; letter-spacing: .1em; color: var(--fg-3); font-family: var(--display); font-weight: 600; }
.clearbox label.chk { flex-direction: row; align-items: center; gap: 6px; text-transform: none; letter-spacing: 0; font-family: var(--body); font-size: 13px; font-weight: 400; color: var(--fg); padding-bottom: 6px; }
.clearbox input[type=password], .clearbox input[type=text] { background: var(--panel); border: 1px solid var(--line-strong); border-radius: 6px; padding: 6px 8px; font-family: var(--body); color: var(--fg); min-width: 0; width: 160px; }
.clearbox .hint { flex-basis: 100%; font-size: 12px; color: var(--fg-2); }
.btn.danger { border-color: var(--bad); color: var(--bad); }
.btn.danger.solid { background: var(--bad); color: #fff; }
.btn:disabled { opacity: .5; cursor: default; }
.subnav { display: inline-flex; gap: 0; border: 1px solid var(--line-strong); border-radius: 8px; overflow: hidden; margin-bottom: 12px; }
.subnav button { background: var(--panel); border: 0; padding: 6px 14px; font-family: var(--display); font-weight: 600; letter-spacing: .06em; text-transform: uppercase; font-size: 12px; color: var(--fg-2); cursor: pointer; }
.subnav button[aria-selected=true] { background: var(--accent); color: var(--accent-ink); }
.btn.solid { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
.lockbox { display: block; }
.lockbox .lhead { display: flex; gap: 12px; align-items: flex-end; flex-wrap: wrap; }
.lockbox input[type=date] { background: var(--panel); border: 1px solid var(--line-strong); border-radius: 6px; padding: 5px 8px; color: var(--fg); font-family: var(--body); }
.lteam { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line); }
.lteam h4, .evb h4 { font-family: var(--display); text-transform: uppercase; letter-spacing: .08em; font-size: 14px; margin: 0 0 8px; }
.lfields { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px; }
.lfields input, .lfields select, .lgrid input.pts { background: var(--panel); border: 1px solid var(--line-strong); border-radius: 6px; padding: 5px 8px; font-family: var(--body); color: var(--fg); min-width: 0; width: 100%; text-transform: none; letter-spacing: 0; }
.lgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 4px 14px; margin-top: 6px; }
.lrow { display: grid; grid-template-columns: 1fr auto 64px; gap: 6px; align-items: center; font-size: 13px; padding: 2px 0; border-bottom: 1px dashed var(--line); }
.lgrid.ro .lrow { grid-template-columns: 1fr auto auto 56px; }
.lrow .n { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lrow .v { text-align: right; color: var(--fg-2); font-variant-numeric: tabular-nums; }
.lgrid input.pts { padding: 2px 6px; font-size: 12px; text-align: right; }
.pchip { border: 0; border-radius: 999px; padding: 1px 9px; font-family: var(--display); font-weight: 700; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; cursor: pointer; line-height: 18px; white-space: nowrap; }
span.pchip { cursor: default; }
.pchip.good { background: var(--good); color: #fff; } .pchip.bad { background: var(--bad); color: #fff; } .pchip.idle { background: transparent; color: var(--fg-3); box-shadow: inset 0 0 0 1px var(--line-strong); }
.lfoot { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end; margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line); }
.dots { white-space: nowrap; } .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 3px; vertical-align: middle; }
.dot.good { background: var(--good); } .dot.bad { background: var(--bad); } .dot.idle { background: transparent; box-shadow: inset 0 0 0 1.5px var(--line-strong); }
.ev { border-top: 1px solid var(--line); padding: 8px 0; } .ev summary { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; cursor: pointer; list-style: none; }
.ev summary::-webkit-details-marker { display: none; } .ev summary::before { content: "▸"; color: var(--fg-3); } .ev[open] summary::before { content: "▾"; }
.res { font-family: var(--display); font-weight: 700; font-size: 12px; letter-spacing: .05em; padding: 1px 8px; border-radius: 4px; box-shadow: inset 0 0 0 1px var(--line-strong); color: var(--fg-2); }
.res.w { background: var(--good); color: #fff; box-shadow: none; } .res.l { background: var(--bad); color: #fff; box-shadow: none; }
.evb { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; padding: 10px 0 4px 18px; }
.wr { margin-bottom: 10px; }
@media (max-width: 720px) { .lfields { grid-template-columns: 1fr 1fr; } .evb { grid-template-columns: 1fr; padding-left: 0; } }
.slot .n.pending::after { content: "⟳"; color: var(--warn); margin-left: 4px; font-size: 11px; }
.qedit { background: none; border: 0; color: var(--fg-3); cursor: pointer; padding: 0 2px; font-size: 12px; }
.qedit:hover { color: var(--accent); }
.rules h4 { font-family: var(--display); text-transform: uppercase; letter-spacing: .1em; font-size: 13px; color: var(--accent); margin: 14px 0 6px; }
.rules table td { white-space: normal; text-align: left; vertical-align: top; font-size: 13px; }

  maxArena = Math.max(1, ...byDate[LATEST].map(x => x.arena || 0));
  leaders = latest.filter(m => m.rank === 'R5' || m.rank === 'R4').sort((a,b) => (a.rank===b.rank ? pw(b)-pw(a) : (a.rank==='R5'?-1:1)));
}

// ---------- Canyon model: the same rule the sheet's W17 / S column apply, so edits preview instantly
function sessKey(s){ s = String(s||''); if (/^Either/.test(s)) return 'Either'; if (/^Both/.test(s)) return 'Both'; if (/^N\/A/.test(s)) return 'N/A'; return s.slice(0,5); }
function recompute(){
  const M = D.meta, CS = M.starters, CAP = CS + M.subs, u4 = sessKey(M.t1), u6 = sessKey(M.t2), t2on = M.t2active !== 'N';
  const hvOf = n => pw(latest.find(m => m.name === n));   // _hv below is the chosen measure, not always hero+vehicle
  D.canyon.forEach(c => {
    const u = sessKey(c.avail);
    const ok1 = u4 === 'Either' ? (u !== '' && u !== 'N/A') : (u === 'Both' || u === u4);
    const ok2 = t2on && (u6 === 'Either' ? (u !== '' && u !== 'N/A') : (u === 'Both' || u === u6));
    c.elig = u === '' ? 'No vote' : ok1 && ok2 ? 'Both' : ok1 ? 'Team 1 only' : ok2 ? 'Team 2 only' : 'Not available';
    c._hv = hvOf(c.name); c.auto = '';
  });
  const T = { T1: [], T2: [] };
  const ord = D.canyon.filter(c => !['No vote','Not available'].includes(c.elig)).sort((a,b) => ((a.elig==='Both')-(b.elig==='Both')) || b._hv - a._hv || (a.name < b.name ? -1 : 1));
  const sStart = team => team.map(p => p._hv).sort((a,b) => b-a).slice(0, CS).reduce((a,b) => a+b, 0);
  ord.forEach(p => {
    const oka = p.elig !== 'Team 2 only' && T.T1.length < CAP, okb = p.elig !== 'Team 1 only' && T.T2.length < CAP; let t;
    if (oka && okb) { const sa = sStart(T.T1), sb = sStart(T.T2), ga = sStart([...T.T1, p]) - sa, gb = sStart([...T.T2, p]) - sb;
      t = ((ga>0) !== (gb>0)) ? (ga>0 ? 'T1' : 'T2') : (ga>0 ? (sa <= sb ? 'T1' : 'T2') : (T.T1.length <= T.T2.length ? 'T1' : 'T2')); }
    else t = oka ? 'T1' : okb ? 'T2' : null;
    if (t) { T[t].push(p); p.auto = t; } else p.auto = 'Bench';
  });
  ['T1','T2'].forEach(t => T[t].slice().sort((a,b) => b._hv - a._hv || (a.name < b.name ? -1 : 1)).forEach((c,i) => c._autoSlot = t + (i < CS ? ' Starter' : ' Sub')));
  D.canyon.forEach(c => {
    const autoSlot = c.auto === 'Bench' ? 'Bench' : c.auto ? c._autoSlot : (c.elig === 'Not available' ? 'Not available' : '');
    c.final = c.manual ? (c.override || c.final) : autoSlot;
  });
}

// ---------- charts (SVG strings) - narrower viewBox on phones so labels stay legible
const narrow = () => innerWidth < 720;
const chartW = () => narrow() ? 380 : 640;
function sparkline(vals, w=120, h=28, col='var(--s1)'){
  if (vals.length < 2) return '';
  const min = Math.min(...vals), max = Math.max(...vals), rng = max-min || 1;
  const pts = vals.map((v,i) => [4 + i*(w-8)/(vals.length-1), h-4 - (v-min)/rng*(h-8)]);
  const d = pts.map((p,i) => (i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const last = pts[pts.length-1];
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" aria-hidden="true"><path d="${d} L${last[0].toFixed(1)} ${h} L4 ${h}Z" fill="${col}" opacity=".12"/><path d="${d}" fill="none" stroke="${col}" stroke-width="2" stroke-linejoin="round"/><circle cx="${last[0].toFixed(1)}" cy="${last[1].toFixed(1)}" r="3" fill="${col}" stroke="var(--panel)" stroke-width="2"/></svg>`;
}
function lineChart(series, labels, opts={}){
  const W = chartW(), H = narrow() ? 190 : 220, L = narrow() ? 46 : 54, R = 16, T = 14, B = 30;
  const all = series.flatMap(s => s.vals); const min = Math.min(...all), max = Math.max(...all);
  const pad = (max-min)*0.15 || max*0.05 || 1; const y0 = min - pad, y1 = max + pad;
  const x = i => L + i*(W-L-R)/Math.max(1, labels.length-1), y = v => T + (H-T-B) - (v-y0)/(y1-y0)*(H-T-B);
  const ticks = 4; let g = '';
  for (let k=0;k<=ticks;k++){ const v = y0 + (y1-y0)*k/ticks; g += `<line class="grid" x1="${L}" x2="${W-R}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}"/><text x="${L-6}" y="${(y(v)+4).toFixed(1)}" text-anchor="end">${fmtM(v)}</text>`; }
  labels.forEach((lb,i) => { g += `<text x="${x(i).toFixed(1)}" y="${H-10}" text-anchor="middle">${esc(lb)}</text>`; });
  series.forEach(s => {
    const d = s.vals.map((v,i) => (i?'L':'M')+x(i).toFixed(1)+' '+y(v).toFixed(1)).join(' ');
    g += `<path d="${d}" fill="none" stroke="${s.col}" stroke-width="2" stroke-linejoin="round"/>`;
    s.vals.forEach((v,i) => { g += `<circle cx="${x(i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="${i===s.vals.length-1?4.5:3.5}" fill="${s.col}" stroke="var(--panel)" stroke-width="2" data-tip="${esc(s.name)}|${esc(labels[i])}: ${fmt(v)}"/>`; });

}
function hbars(rows, opts={}){ // rows: {label, segs:[{v,col,name}], total, sub}
  const W = opts.W ? Math.min(opts.W, chartW()) : chartW(), LW = Math.min(opts.labelW || 120, narrow() ? 90 : 120), RW = 56, rh = 22, H = rows.length*rh + 6;
  const max = Math.max(...rows.map(r => r.total)); const sx = v => v/max*(W-LW-RW-8);
  let g = '';
  rows.forEach((r,i) => {

    r.segs.forEach((s,k) => { const w = Math.max(0, sx(s.v) - (k?2:0)); g += `<rect x="${(x+(k?2:0)).toFixed(1)}" y="${y+4}" width="${w.toFixed(1)}" height="14" rx="${k===r.segs.length-1?3:0}" fill="${s.col}" data-tip="${esc(r.label)}|${esc(s.name)}: ${fmt(s.v)}${r.sub?' · '+esc(r.sub):''}"/>`; x += sx(s.v); });
    g += `<text class="lbl-strong" x="${(x+6).toFixed(1)}" y="${y+15}">${fmtM(r.total)}</text>`;

  const W = chartW(), LW = narrow() ? 96 : 130, rh = 22, H = rows.length*rh + 6, allNeg = rows.length > 0 && (rows.every(r => r.v < 0) || rows.every(r => r.v >= 0)), mid = allNeg ? LW : LW + (W-LW-70)/2;

  const max = Math.max(...rows.map(r => Math.abs(r.v))) || 1; const sx = v => Math.abs(v)/max*(allNeg ? W - LW - 70 : (W-LW-70)/2 - 4);

    g += `<rect x="${(pos?mid+1:mid-1-w).toFixed(1)}" y="${y+4}" width="${w.toFixed(1)}" height="14" rx="3" fill="${r.v >= 0?'var(--good)':'var(--bad)'}" data-tip="${esc(r.label)}|${signed(r.v)} (${r.sub||''})"/>`;

function canyonSummary(){

  D.canyon.forEach(c => { const f = c.final || ''; const t = f.startsWith('T1') ? 'T1' : f.startsWith('T2') ? 'T2' : null; if (t) teams[t].push({ ...c, hv: hvOf(c.name), starter: f.endsWith('Starter') }); });
  Object.values(teams).forEach(a => a.sort((x,y) => y.hv - x.hv));
  const st = t => sum(teams[t].filter(p => p.starter), p => p.hv);
  const s1 = st('T1'), s2 = st('T2'), gap = s1 - s2, strong = gap >= 0 ? 'Team 1' : 'Team 2';

}

// ---------- Canyon Clash ledger: who was rostered on each Friday, who showed, and how each team did.
// Stored by the board API (GET/POST /ledger) and mirrored into the tracker's Canyon Ledger tabs. Players are keyed by
// in-game UID so a rename keeps one history; the newest name on the roster is the one shown.
const LEDGER_API = API_URL || 'https://jtb293-board.thebadnewsbard.workers.dev';
let LEDGER = { rev: 0, events: [] }, ledgerState = 'loading';
const STATUS = { show: ['Show', 'good'], 'no-show': ['No-show', 'bad'], played: ['Played', 'good'], 'not-needed': ['Not needed', 'idle'] };
const sessOf = t => sessKey(t === 'T1' ? D.meta.t1 : D.meta.t2);          // "23:00" / "18:00"
const teamName = t => (t === 'T1' ? 'Team 1' : 'Team 2') + ' · ' + sessOf(t);
// In-game UID when the capture has one (newest snapshot first, then older ones); the name otherwise. Renames of members
// without a UID are carried into the ledger by POST /ledger/rename (the weekly run calls it when it applies a rename).
const uidOf = name => { const h = (hist[name] || []).slice().reverse().find(x => x.uid); return h ? String(h.uid) : ''; };
const nameByUid = () => { const o = {}; latest.forEach(m => { const u = uidOf(m.name); if (u) o[u] = m.name; }); return o; };
const pkey = p => p.uid ? String(p.uid) : 'name:' + p.name;
function parsePower(v){
  const s = String(v ?? '').trim().replace(/,/g, '').replace(/\s/g, ''); if (!s) return null;
  const m = s.match(/^(\d*\.?\d+)([KMBG])?$/i); if (!m) return NaN;
  return +m[1] * ({ k: 1e3, m: 1e6, b: 1e9, g: 1e9 }[(m[2] || '').toLowerCase()] || 1);
}
function lastFriday(){ const d = new Date(); d.setHours(12,0,0,0); d.setDate(d.getDate() - ((d.getDay() + 2) % 7)); return d.toISOString().slice(0,10); }
async function loadLedger(){
  if (!LEDGER_API) { ledgerState = 'off'; return; }
  try { const r = await fetch(LEDGER_API + '/ledger', { cache: 'no-store' }); if (!r.ok) throw new Error(r.status); LEDGER = await r.json(); LEDGER.events = LEDGER.events || []; ledgerState = 'ok'; }
  catch (e) { ledgerState = 'offline'; }
  if ((current === 'trends' || current === 'canyon') && !lockOpen) renderAll();
}
async function postLedger(path, body, k){
  const r = await fetch(LEDGER_API + path, { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Code': k }, body: JSON.stringify(body) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(r.status === 401 ? 'That passcode is not recognised' : r.status === 403 ? 'The ledger needs the officer code' : (j.error || ('HTTP ' + r.status)));
  return j;
}

let lockOpen = false, lockBusy = false, LK = null;
function lockDraftFor(date){

  if (ev) return { date, edit: true, teams: Object.fromEntries(['T1','T2'].map(t => [t, { ...(ev.teams.find(x => x.team === t) || { team: t }) }])), players: ev.players.map(p => ({ ...p })), measure: ev.measure };
  const cs = canyonSummary(), players = [];
  ['T1','T2'].forEach(t => cs.teams[t].forEach(p => players.push({ uid: uidOf(p.name), name: p.name, team: t, role: p.starter ? 'Starter' : 'Sub', status: p.starter ? 'show' : 'not-needed', points: null })));
  const teams = {}; ['T1','T2'].forEach(t => { teams[t] = { team: t, session: sessOf(t), oppServer: '', oppAlliance: '', oppPower: null, score: null, oppScore: null, result: '', ourPower: t === 'T1' ? cs.s1 : cs.s2, starters: cs.teams[t].filter(p => p.starter).length }; });
  return { date, edit: false, teams, players, measure: D.meta.by };
}
function openLock(date){

  date = date || (saved && saved.date) || lastFriday();

show(views[hash] ? hash : (ls.get('jtb-tab') || 'overview'));
